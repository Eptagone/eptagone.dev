# yaml-language-server: $schema=https://json.schemastore.org/lefthook.json

pre-commit:
  parallel: true
  commands:
    astro-check:
      glob: "*.{ts,tsx,astro,css}"
      run: pnpm dlx astro check
    elint:
      glob: "*.{ts,tsx}"
      run: pnpm dlx eslint src
    increase-version:
      glob: "*.{ts,tsx,astro,css,json,txt}"
      run: pnpm exec tsx tools/increase-version.ts {staged_files}
